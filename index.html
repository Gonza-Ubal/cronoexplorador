<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22303c">
  <title>Cronoexplorador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra-sup no-imprimir">
    <button id="btn-inicio" class="marca-app">Cronoexplorador</button>
    <button id="btn-calma" class="btn calma-btn">🌙 Cápsula de calma</button>
  </header>

  <main id="app" tabindex="-1"><p class="narr">Enganchando el cronomosquetón…</p></main>

  <div id="calma" hidden role="dialog" aria-label="Cápsula de calma">
    <div class="estrellas" aria-hidden="true"></div>
    <button id="calma-salir" class="btn">← Volver al juego</button>
  </div>

  <noscript><p>Este juego necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
